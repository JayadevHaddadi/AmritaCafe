name: Build & Pre-Release

on:
  push:
    branches: [ master, main, 7008 ]
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          cat << 'EOF' > local.properties
          google.script.menu.url="https://script.google.com/macros/s/AKfycbyb4ey0BF43Vuk4g4r4SGs-2NP4HEvNF0kn-pPEhsYtODwXKyp4G7P-1_Zhlmd1LrEB/exec"
          google.script.order.url="https://script.google.com/macros/s/AKfycbzQp6Ubp3lifOpr7kMwnTVVJoMQWPfNEsDv8W96clYZe10C9f2Sluy5jBXPNuJktERx/exec"
          google.script.update.url="https://script.google.com/macros/s/AKfycbzsKjmn3n74W2kP1_FC1A93Cao5953VjswyVTPBkCFeiN46PpiMzWcXFY47d1VlQajm/exec"
          EOF

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Extract Version from build.gradle
        id: version_info
        run: |
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -1 | tr -dc '0-9')
          VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | cut -d'"' -f2)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Notes
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "### Changes in Build ${{ steps.version_info.outputs.VERSION_CODE }}" > RELEASE_NOTES.md
            git log -1 --pretty=format:"%B" >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/7008' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version_info.outputs.VERSION_CODE }}
          name: "Amrita Cafe ${{ steps.version_info.outputs.VERSION_NAME }} (${{ steps.version_info.outputs.VERSION_CODE }})"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: true
          draft: false
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

